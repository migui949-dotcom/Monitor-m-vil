[package]
name = "pantalla-host"
version = "0.4.0"
edition = "2021"
description = "Servicio del ordenador para la app Pantalla del móvil (un solo binario)"
license-file = "LICENSE"
repository = "https://github.com/migui949-dotcom/Monitor-m-vil"

[dependencies]
base64 = "0.22"
blake2 = "0.10"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
getrandom = "0.2"
serde_json = "1"
snow = "0.9"
tokio = { version = "1", features = ["full"] }
openh264 = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
memmap2 = "0.9"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
fuser = { version = "0.14", default-features = false }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Threading",
  "Win32_UI_HiDpi", "Win32_System_Variant", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Console",
] }
