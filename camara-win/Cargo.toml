[package]
name = "pantalla-camara"
version = "0.1.0"
edition = "2021"
description = "Cámara virtual de Windows 11 (MFCreateVirtualCamera) para la cámara del móvil de pantalla-host"
license-file = "../LICENSE"

[lib]
name = "pantalla_camara"
crate-type = ["cdylib"]

[dependencies]
windows-core = "0.58"
windows = { version = "0.58", features = [
  "implement", "Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_Media_KernelStreaming", "Win32_System_Com",
  "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Memory", "Win32_Security",
  "Win32_Security_Authorization", "Win32_System_SystemInformation", "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
strip = true
panic = "abort"
